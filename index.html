
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Online Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        /* HEADER */
        header {
            background: #111827;
            color: white;
            padding: 15px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #60a5fa;
        }

        nav {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .cart-btn {
            background: #2563eb;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        /* HERO */
        .hero {
            min-height: 420px;
            background: linear-gradient(120deg, #dbeafe, #eff6ff);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px 8%;
        }

        .hero-content {
            max-width: 550px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
            color: #111827;
        }

        .hero p {
            font-size: 18px;
            color: #4b5563;
            margin-bottom: 25px;
        }

        .shop-now {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .hero-image {
            font-size: 150px;
        }

        /* SEARCH */
        .search-section {
            padding: 30px 7%;
            text-align: center;
        }

        .search-box {
            width: 70%;
            max-width: 600px;
            padding: 14px 20px;
            border: 1px solid #ccc;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }

        /* CATEGORIES */
        .categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .category-btn {
            padding: 10px 18px;
            border: none;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .category-btn.active,
        .category-btn:hover {
            background: #2563eb;
            color: white;
        }

        /* PRODUCTS */
        .products-section {
            padding: 10px 7% 60px;
        }

        .section-title {
            text-align: center;
            font-size: 30px;
            margin-bottom: 30px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: 0.3s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .category {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 15px;
        }

        .add-cart {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
            background: #111827;
            color: white;
            cursor: pointer;
        }

        .add-cart:hover {
            background: #2563eb;
        }

        .wishlist {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: none;
            background: white;
            font-size: 18px;
            cursor: pointer;
        }

        .wishlist.liked {
            color: red;
        }

        /* CART */
        .cart-panel {
            position: fixed;
            right: -420px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: white;
            z-index: 2000;
            box-shadow: -5px 0 20px rgba(0,0,0,0.2);
            transition: 0.3s;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .cart-panel.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 25px;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
        }

        .cart-item {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .cart-item img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 7px;
        }

        .cart-details {
            flex: 1;
        }

        .cart-details h4 {
            margin-bottom: 6px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .quantity button {
            width: 25px;
            height: 25px;
            border: none;
            background: #e5e7eb;
            cursor: pointer;
            border-radius: 4px;
        }

        .remove {
            background: none;
            border: none;
            color: red;
            cursor: pointer;
            margin-top: 5px;
        }

        .cart-footer {
            border-top: 1px solid #ddd;
            padding-top: 18px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .checkout {
            width: 100%;
            padding: 13px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        /* NOTIFICATION */
        .notification {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #111827;
            color: white;
            padding: 14px 20px;
            border-radius: 7px;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.3s;
            z-index: 3000;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* FOOTER */
        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px;
        }

        /* RESPONSIVE */
        @media (max-width: 1000px) {
            .products {
                grid-template-columns: repeat(3, 1fr);
            }

            .hero-image {
                font-size: 100px;
            }
        }

        @media (max-width: 750px) {
            header {
                padding: 15px 4%;
            }

            nav a {
                display: none;
            }

            .hero {
                text-align: center;
                flex-direction: column;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero-image {
                font-size: 80px;
                margin-top: 25px;
            }

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

            .search-box {
                width: 90%;
            }

            .cart-panel {
                width: 100%;
                right: -100%;
            }
        }

        @media (max-width: 500px) {
            .products {
                grid-template-columns: 1fr;
            }

            .products-section {
                padding-left: 5%;
                padding-right: 5%;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">ShopEase</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#about">About</a>

            <button class="cart-btn" onclick="openCart()">
                🛒 Cart (<span id="cart-count">0</span>)
            </button>
        </nav>
    </header>


    <!-- HERO -->
    <section class="hero" id="home">

        <div class="hero-content">
            <h1>Shop Smart. Live Better.</h1>

            <p>
                Discover amazing products at great prices.
                Find everything you need in one place.
            </p>

            <button class="shop-now"
                    onclick="document.getElementById('products').scrollIntoView()">
                Shop Now
            </button>
        </div>

        <div class="hero-image">
            🛍️
        </div>

    </section>


    <!-- SEARCH -->
    <section class="search-section">

        <input
            type="text"
            id="search"
            class="search-box"
            placeholder="🔍 Search for products..."
            onkeyup="searchProducts()"
        >

    </section>


    <!-- CATEGORIES -->
    <div class="categories">

        <button class="category-btn active"
                onclick="filterProducts('all', this)">
            All
        </button>

        <button class="category-btn"
                onclick="filterProducts('electronics', this)">
            Electronics
        </button>

        <button class="category-btn"
                onclick="filterProducts('fashion', this)">
            Fashion
        </button>

        <button class="category-btn"
                onclick="filterProducts('shoes', this)">
            Shoes
        </button>

        <button class="category-btn"
                onclick="filterProducts('accessories', this)">
            Accessories
        </button>

    </div>


    <!-- PRODUCTS -->
    <section class="products-section" id="products">

        <h2 class="section-title">
            Popular Products
        </h2>

        <div class="products" id="product-container">
        </div>

    </section>


    <!-- CART -->
    <div class="cart-panel" id="cart-panel">

        <div class="cart-header">

            <h2>Your Cart</h2>

            <button class="close-cart"
                    onclick="closeCart()">
                ×
            </button>

        </div>

        <div class="cart-items" id="cart-items">
        </div>

        <div class="cart-footer">

            <div class="total">
                <span>Total:</span>
                <span>₹<span id="cart-total">0</span></span>
            </div>

            <button class="checkout"
                    onclick="checkout()">
                Proceed to Checkout
            </button>

        </div>

    </div>


    <!-- NOTIFICATION -->
    <div class="notification" id="notification">
        Product added to cart!
    </div>


    <!-- FOOTER -->
    <footer id="about">

        <h3>ShopEase</h3>

        <p>
            Your simple online shopping destination.
        </p>

        <br>

        <p>
            © 2026 ShopEase. All rights reserved.
        </p>

    </footer>


    <script>

        // PRODUCT DATA

        const products = [

            {
                id: 1,
                name: "Wireless Headphones",
                category: "electronics",
                price: 1499,
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80"
            },

            {
                id: 2,
                name: "Smart Watch",
                category: "electronics",
                price: 2499,
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80"
            },

            {
                id: 3,
                name: "Casual T-Shirt",
                category: "fashion",
                price: 699,
                image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80"
            },

            {
                id: 4,
                name: "Denim Jacket",
                category: "fashion",
                price: 1599,
                image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=600&q=80"
            },

            {
                id: 5,
                name: "Running Shoes",
                category: "shoes",
                price: 1999,
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"
            },

            {
                id: 6,
                name: "White Sneakers",
                category: "shoes",
                price: 1799,
                image: "https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?auto=format&fit=crop&w=600&q=80"
            },

            {
                id: 7,
                name: "Leather Backpack",
                category: "accessories",
                price: 1299,
                image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80"
            },

            {
                id: 8,
                name: "Classic Sunglasses",
                category: "accessories",
                price: 899,
                image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=600&q=80"
            }

        ];


        // CART

        let cart = [];


        // DISPLAY PRODUCTS

        function displayProducts(productList) {

            const container =
                document.getElementById("product-container");

            container.innerHTML = "";

            if (productList.length === 0) {

                container.innerHTML =
                    "<h3>No products found.</h3>";

                return;
            }


            productList.forEach(product => {

                const card = document.createElement("div");

                card.className = "product-card";

                card.innerHTML = `

                    <button
                        class="wishlist"
                        onclick="toggleWishlist(this)">
                        ♡
                    </button>

                    <img
                        class="product-image"
                        src="${product.image}"
                        alt="${product.name}"
                    >

                    <div class="product-info">

                        <h3>${product.name}</h3>

                        <p class="category">
                            ${product.category}
                        </p>

                        <p class="price">
                            ₹${product.price.toLocaleString("en-IN")}
                        </p>

                        <button
                            class="add-cart"
                            onclick="addToCart(${product.id})">
                            Add to Cart
                        </button>

                    </div>
                `;

                container.appendChild(card);

            });

        }


        // ADD TO CART

        function addToCart(productId) {

            const product =
                products.find(p => p.id === productId);

            const existing =
                cart.find(item => item.id === productId);


            if (existing) {

                existing.quantity++;

            } else {

                cart.push({
                    ...product,
                    quantity: 1
                });

            }


            updateCart();

            showNotification(
                product.name + " added to cart!"
            );

        }


        // UPDATE CART

        function updateCart() {

            const cartItems =
                document.getElementById("cart-items");

            const cartCount =
                document.getElementById("cart-count");

            const cartTotal =
                document.getElementById("cart-total");


            cartItems.innerHTML = "";


            let total = 0;
            let count = 0;


            cart.forEach(item => {

                total += item.price * item.quantity;

                count += item.quantity;


                const div =
                    document.createElement("div");

                div.className = "cart-item";


                div.innerHTML = `

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div class="cart-details">

                        <h4>${item.name}</h4>

                        <p>
                            ₹${item.price.toLocaleString("en-IN")}
                        </p>

                        <div class="quantity">

                            <button
                                onclick="changeQuantity(${item.id}, -1)">
                                −
                            </button>

                            <span>${item.quantity}</span>

                            <button
                                onclick="changeQuantity(${item.id}, 1)">
                                +
                            </button>

                        </div>

                        <button
                            class="remove"
                            onclick="removeFromCart(${item.id})">
                            Remove
                        </button>

                    </div>
                `;


                cartItems.appendChild(div);

            });


            cartCount.textContent = count;

            cartTotal.textContent =
                total.toLocaleString("en-IN");

        }


        // CHANGE QUANTITY

        function changeQuantity(productId, amount) {

            const item =
                cart.find(item => item.id === productId);


            if (!item) return;


            item.quantity += amount;


            if (item.quantity <= 0) {

                cart =
                    cart.filter(item =>
                        item.id !== productId
                    );

            }


            updateCart();

        }


        // REMOVE PRODUCT

        function removeFromCart(productId) {

            cart =
                cart.filter(item =>
                    item.id !== productId
                );

            updateCart();

        }


        // OPEN CART

        function openCart() {

            document
                .getElementById("cart-panel")
                .classList.add("open");

        }


        // CLOSE CART

        function closeCart() {

            document
                .getElementById("cart-panel")
                .classList.remove("open");

        }


        // CATEGORY FILTER

        function filterProducts(category, button) {

            document
                .querySelectorAll(".category-btn")
                .forEach(btn =>
                    btn.classList.remove("active")
                );


            button.classList.add("active");


            if (category === "all") {

                displayProducts(products);

            } else {

                const filtered =
                    products.filter(
                        product =>
                            product.category === category
                    );

                displayProducts(filtered);

            }

        }


        // SEARCH

        function searchProducts() {

            const search =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase();


            const filtered =
                products.filter(product =>
                    product.name
                        .toLowerCase()
                        .includes(search)
                );


            displayProducts(filtered);

        }


        // WISHLIST

        function toggleWishlist(button) {

            button.classList.toggle("liked");


            if (button.classList.contains("liked")) {

                button.textContent = "♥";

            } else {

                button.textContent = "♡";

            }

        }


        // NOTIFICATION

        function showNotification(message) {

            const notification =
                document.getElementById("notification");


            notification.textContent = message;

            notification.classList.add("show");


            setTimeout(() => {

                notification.classList.remove("show");

            }, 2000);

        }


        // CHECKOUT

        function checkout() {

            if (cart.length === 0) {

                alert("Your cart is empty!");

                return;

            }


            alert(
                "Thank you for shopping with ShopEase! 🛍️"
            );


            cart = [];

            updateCart();

            closeCart();

        }


        // INITIAL LOAD

        displayProducts(products);

        updateCart();

    </script>

</body>
</html>
